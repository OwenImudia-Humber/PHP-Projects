<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Feedback</title>
</head>
<body>
    <h1>Upload a Feedback File</h1>
    <form action="upload-feedback.php" method="post" enctype="multipart/form-data">
        <label for="feedback_file">Choose a text or CSV feedback file:</label>
        <input type="file" id="feedback_file" name="feedback_file" accept=".txt,.csv" required>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
